services:
  db:
    image: postgres:16
    container_name: stylesense-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stylesense
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - stylesense-db-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stylesense"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: vanshika550/stylesense-server:latest
    container_name: stylesense-server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/stylesense
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  client:
    image: vanshika550/stylesense-client:latest
    container_name: stylesense-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  stylesense-db-data:

